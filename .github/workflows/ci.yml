name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements/*.txt', 'requirements/requirements.lock') }}
      - run: python -m pip install -r requirements/requirements.lock -r requirements/test.txt -e .
      - run: python -m ruff check . --output-format=github
      - run: python -m ruff format --check .
  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements/*.txt', 'requirements/requirements.lock') }}
      - run: python -m pip install -r requirements/requirements.lock -r requirements/test.txt -e .
      - run: python -m mypy --strict src/ tests/
  test:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements/*.txt', 'requirements/requirements.lock') }}
      - run: python -m pip install -r requirements/requirements.lock -r requirements/test.txt -e .
      - run: python -m pytest -v --cov=src --cov-branch --cov-fail-under=80 --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: Run Alembic integration test
        run: python -m pytest -m integration -v --no-cov
      - name: Summarize coverage
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from xml.etree import ElementTree
          rate = float(ElementTree.parse("coverage.xml").getroot().attrib["line-rate"])
          print(f"Line coverage: {rate:.2%}")
          branch_rate = float(ElementTree.parse("coverage.xml").getroot().attrib["branch-rate"])
          print(f"Branch coverage: {branch_rate:.2%}")
          if branch_rate < 0.8:
              raise SystemExit("Branch coverage is below 80%")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
