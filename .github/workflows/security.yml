name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements/base.txt --format json
  secret-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan tracked files for verified secrets
        run: |
          scan_root="$(mktemp -d)"
          git archive HEAD | tar -xf - -C "$scan_root"
          docker run --rm -v "$scan_root:/scan:ro" trufflesecurity/trufflehog:3.90.0 \
            filesystem /scan --only-verified --fail --json > "$RUNNER_TEMP/trufflehog.json"
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install bandit[toml]==1.9.4
      - run: python -m bandit -c pyproject.toml -r src/ -ll -f json -o bandit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit.json
