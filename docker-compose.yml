services:
  devflow-api:
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/devflow.db
    volumes:
      - devflow-data:/data
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  devflow-ui:
    build:
      context: .
      target: ui
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      DEVFLOW_API_BASE_URL: http://devflow-api:8000
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/_stcore/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      devflow-api:
        condition: service_healthy

volumes:
  devflow-data:
