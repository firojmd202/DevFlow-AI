[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow-ai"
version = "0.1.0"
description = "A local-first AI development and learning orchestrator"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements/base.txt"] }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
strict = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short --cov=src --cov-branch --cov-fail-under=80 --cov-report=term-missing"
markers = ["integration: marks tests requiring external resources (skipped in CI by default)"]

[tool.coverage.run]
branch = true
# Async SQLAlchemy switches into greenlets while handling database operations.
concurrency = ["greenlet", "thread"]
source = ["src"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80

[tool.bandit]
skips = ["B101"]
